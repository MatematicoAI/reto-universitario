<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto Universitario</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fb;font:16px system-ui,Arial;color:#18264c}header{background:#253b83;color:white;padding:22px;text-align:center}main{max-width:860px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #d5deef;border-radius:16px;padding:23px;margin-bottom:18px}button{border:0;border-radius:10px;padding:12px 17px;margin:4px;background:#4458ae;color:white;cursor:pointer;font:600 15px system-ui}button:disabled{opacity:.4;cursor:default}input{display:block;padding:12px;border:1px solid #b7c4da;border-radius:9px;width:100%;max-width:450px;margin:10px 0 16px;font:inherit}.hide{display:none}.choice{display:block;width:100%;text-align:left;background:#e8eeff;color:#1e336b;margin:9px 0}#notice{background:#fff0d7;padding:13px;border-radius:10px;white-space:pre-wrap;margin:12px 0}.metric{display:inline-block;background:#e9edff;padding:12px;border-radius:10px;margin:5px}.answer{padding:9px 0;border-bottom:1px solid #e1e6f1}a{overflow-wrap:anywhere}.code{font-size:2rem;letter-spacing:.15em;font-weight:bold}
</style><header><h1>🎓 RETO UNIVERSITARIO</h1><p>¿Dónde busco cada cosa? · Bienvenida universitaria</p></header><main><div id="notice" class="hide"></div>
<section id="home" class="card"><h2>Seleccione su acceso</h2><button id="studentOpen">Soy estudiante</button><button id="teacherOpen">Soy docente</button></section>
<section id="studentLogin" class="card hide"><h2>Participar</h2><label>Código de sesión<input id="code" maxlength="6" autocomplete="off"></label><label>Nombres y apellidos<input id="name" maxlength="70"></label><button id="join">Ingresar</button></section>
<section id="studentView" class="card hide"><small style="color:#536aa2">Versión 1.5 · temporizador 10/15/20 s</small><h2 id="studentTitle">Espere al docente</h2><p id="studentQuestion"></p><div id="studentTimer" role="status" style="font-size:28px;font-weight:bold;color:#b13b20;margin:12px 0"></div><div id="choices"></div></section>
<section id="teacherLogin" class="card hide"><h2>Acceso docente</h2><label>Correo<input type="email" id="email"></label><label>Contraseña<input type="password" id="password"></label><button id="login">Ingresar</button></section>
<section id="teacherView" class="card hide"><h2>Panel docente</h2><label for="timeLimit">Tiempo por pregunta</label><select id="timeLimit" style="display:block;padding:12px;margin:12px 0;border:1px solid #aebcce;border-radius:8px"><option value="10">10 segundos</option><option value="15" selected>15 segundos</option><option value="20">20 segundos</option></select><button id="make">Crear sesión</button><button id="logout">Salir</button><div id="active" class="hide"><p>Código de sesión</p><div id="roomCode" class="code"></div><p><a id="roomLink" target="_blank"></a></p><button id="start">Iniciar</button><button id="next">Siguiente pregunta</button><button id="finish">Finalizar</button><button id="csv">Descargar resultados</button><p id="stats"></p><div id="teacherTimer" style="font-size:24px;font-weight:bold"></div><h3 id="teacherQuestion"></h3><div id="bars"></div><h3>Clasificación</h3><div id="ranking"></div></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,signInAnonymously,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyC3lTXTzcfRiyNDluZCY7rgO28jR9yOHxQ",authDomain:"reto-universitario.firebaseapp.com",projectId:"reto-universitario",storageBucket:"reto-universitario.firebasestorage.app",messagingSenderId:"708110195138",appId:"1:708110195138:web:99fa4eb8854855f1639e5b"};
const teacherUid="xok3lxvoHGQte2zOIaYM81XCHZi2";
const questions=[
["¿Dónde revisas los materiales del curso?",["Canvas","Portal del Estudiante","Banco","Correo personal"],0],
["¿Dónde consultas tus notas y horarios?",["WhatsApp","Portal del Estudiante","Redes sociales","Admisión"],1],
["¿Qué puedes encontrar en Canvas?",["Módulos, anuncios y actividades","Trámites bancarios","Notas de todos los ciclos","Documentos personales"],0],
["¿Qué revisas primero si no puedes ingresar?",["Crear otra cuenta","Usuario y contraseña","Pedir la clave a un compañero","Abandonar"],1],
["Si un material no aparece, ¿qué ayuda a reportar el problema?",["No hacer nada","Captura y explicación de lo que intentabas","Cambiar de curso","Esperar al examen"],1],
["¿Dónde están los anuncios del docente?",["Portal de pagos","Canvas","Página de admisión","Banco"],1],
["¿Dónde consultas tu avance académico general?",["Portal del Estudiante","Canvas exclusivamente","Facebook","Chat de amigos"],0],
["¿Qué haces si después de revisar tus credenciales aún no ingresas?",["Compartir tu contraseña","Solicitar apoyo e indicar la plataforma","Crear cuentas nuevas","Ignorarlo"],1],
["¿Dónde buscas una actividad publicada por el docente?",["En el curso de Canvas","En trámites","En matrícula","En redes sociales"],0],
["¿Cuál es la diferencia principal?",["Ambos son iguales","Canvas: actividades; Portal: información académica general","Portal: solo docentes","Canvas reemplaza al Portal"],1]
];
const $=id=>document.getElementById(id),auth=getAuth(initializeApp(firebaseConfig)),db=getFirestore();let current=null,code=null,studentUid=null,participants=[],responses=[],unsubs=[],submitted=false;let interval=setInterval(()=>{if(current){const n=remaining();if(!$('studentView').classList.contains('hide')){const el=$('studentTimer');if(current.status==='live'&&current.currentIndex>=0){el.textContent=n===null?'Preparando tiempo…':n>0?'⏱ '+n+' segundos':'⏱ Tiempo agotado';if(n===0&&$('choices').querySelector('button'))renderStudent()}}if(!$('teacherView').classList.contains('hide'))$('teacherTimer').textContent=current.status==='live'&&current.currentIndex>=0?(n===null?'Preparando reloj':n>0?'Tiempo restante: '+n+' s':'Tiempo agotado: pulse Siguiente pregunta o Finalizar'):''}},350);function remaining(){if(!current||!current.questionStartedAt||typeof current.questionStartedAt.toMillis!=='function')return null;return Math.max(0,Math.ceil((current.questionStartedAt.toMillis()+current.timeLimit*1000-Date.now())/1000))}
function notice(t){$('notice').textContent=t;$('notice').classList.remove('hide')}function section(id){for(const x of ['home','studentLogin','studentView','teacherLogin','teacherView'])$(x).classList.toggle('hide',x!==id)}function stop(){unsubs.forEach(f=>f());unsubs=[]}function err(e){notice(e.code==='permission-denied'?'Acceso denegado. Compruebe la autenticación y las reglas de Firestore.':e.message||String(e))}
$('studentOpen').onclick=()=>section('studentLogin');$('teacherOpen').onclick=()=>section('teacherLogin');
const pre=new URLSearchParams(location.search).get('code');if(pre){$('code').value=pre.toUpperCase();section('studentLogin')}
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);if(auth.currentUser.uid!==teacherUid){await signOut(auth);throw Error('Su cuenta no tiene permiso docente.')}section('teacherView')}catch(e){err(e)}};
$('logout').onclick=async()=>{stop();await signOut(auth);section('home')};
$('make').onclick=async()=>{try{stop();code=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');await setDoc(doc(db,'rooms',code),{teacherUid:auth.currentUser.uid,status:'waiting',currentIndex:-1,createdAt:serverTimestamp(),timeLimit:Number($('timeLimit').value),questionStartedAt:null});$('active').classList.remove('hide');$('roomCode').textContent=code;const u=new URL(location.href);u.searchParams.set('code',code);$('roomLink').textContent=u.href;$('roomLink').href=u.href;
unsubs.push(onSnapshot(doc(db,'rooms',code),s=>{current=s.data();renderTeacher()},err));unsubs.push(onSnapshot(collection(db,'rooms',code,'participants'),s=>{participants=s.docs.map(d=>d.data());renderTeacher()},err));unsubs.push(onSnapshot(collection(db,'rooms',code,'responses'),s=>{responses=s.docs.map(d=>d.data());renderTeacher()},err))}catch(e){err(e)}};
$('start').onclick=()=>move('live',0);$('next').onclick=()=>move('live',current.currentIndex+1);$('finish').onclick=()=>move('finished',current.currentIndex);
async function move(status,index){try{await updateDoc(doc(db,'rooms',code),{status,currentIndex:index,questionStartedAt:status==='live'?serverTimestamp():current.questionStartedAt})}catch(e){err(e)}}
function renderTeacher(){if(!current)return;const i=current.currentIndex,r=responses.filter(x=>x.questionIndex===i);$('start').disabled=current.status!=='waiting';$('next').disabled=current.status!=='live'||i>=9;$('finish').disabled=current.status==='finished';$('stats').textContent=participants.length+' participantes · '+r.length+' respuestas actuales · '+current.status;$('teacherQuestion').textContent=i>=0?questions[i][0]:'Esperando inicio';$('bars').replaceChildren();if(i>=0)questions[i][1].forEach((t,j)=>{const p=document.createElement('p');p.className='answer';p.textContent=t+': '+r.filter(x=>x.option===j).length;$('bars').append(p)});$('ranking').replaceChildren();participants.map(p=>({name:p.name,score:responses.filter(r=>r.uid===p.uid&&questions[r.questionIndex]?.[2]===r.option).length})).sort((a,b)=>b.score-a.score).forEach((p,i)=>{const d=document.createElement('p');d.textContent=(i+1)+'. '+p.name+' — '+p.score+' puntos';$('ranking').append(d)})}
$('join').onclick=async()=>{try{const c=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z0-9]{6}$/.test(c)||name.length<2||name.length>70)throw Error('Ingrese código válido y nombre completo.');if(!auth.currentUser)await signInAnonymously(auth);if(auth.currentUser.isAnonymous!==true)throw Error('Abra la actividad desde otro navegador para entrar como estudiante.');studentUid=auth.currentUser.uid;const s=await getDoc(doc(db,'rooms',c));if(!s.exists())throw Error('Código de sesión inexistente.');if(s.data().status!=='waiting')throw Error('Esta sesión ya comenzó o finalizó. Solicite al docente un código de sesión nueva para iniciar desde la pregunta 1.');const ref=doc(db,'rooms',c,'participants',studentUid);if(!(await getDoc(ref)).exists())await setDoc(ref,{uid:studentUid,name,joinedAt:serverTimestamp()});code=c;stop();current=null;submitted=false;section('studentView');unsubs.push(onSnapshot(doc(db,'rooms',code),s=>{const old=current?.currentIndex;current=s.data();if(old!==current?.currentIndex)submitted=false;renderStudent()},err))}catch(e){err(e)}};
function renderStudent(){try{
if(!current)return;
const i=current.currentIndex;
const target=$('choices');target.replaceChildren();target.style.display='block';target.style.minHeight='120px';
if(current.status==='finished'){$('studentTitle').textContent='Actividad finalizada';$('studentQuestion').textContent='Gracias por participar. Su sesión permanecerá abierta para que pueda ver este mensaje.';target.textContent='La actividad ha terminado. Puede cerrar esta página cuando lo desee.';return}
if(i<0){$('studentTimer').textContent='';$('studentTitle').textContent='Esperando al docente';$('studentQuestion').textContent='La primera pregunta aparecerá aquí';target.textContent='Conectado a la sesión.';return}
if(!questions[i]){target.textContent='Índice de pregunta no válido: '+i;return}
$('studentTitle').textContent='Pregunta '+(i+1)+' de '+questions.length;
$('studentQuestion').textContent=questions[i][0];
const key='reto-respuesta-'+code+'-'+studentUid+'-'+i;
if(sessionStorage.getItem(key)==='1')submitted=true;
if(submitted){target.textContent='Su respuesta ya fue registrada. Espere a la siguiente pregunta.';return}if(remaining()===null){target.textContent='Preparando el temporizador de esta pregunta…';return}if(remaining()===0){target.textContent='Tiempo agotado. Espere a la siguiente pregunta.';return}
for(const [j,t] of questions[i][1].entries()){
const b=document.createElement('button');b.type='button';b.className='choice';b.style.cssText='display:block!important;width:100%!important;min-height:54px!important;background:#dfe8ff!important;color:#172f65!important;border:2px solid #9aaeea!important;margin:10px 0!important;text-align:left!important;visibility:visible!important;opacity:1!important';
b.textContent='ABCD'[j]+'. '+t;
b.onclick=async()=>{if(remaining()===0){renderStudent();return}for(const btn of target.querySelectorAll('button'))btn.disabled=true;
try{await setDoc(doc(db,'rooms',code,'responses',studentUid+'_'+i),{uid:studentUid,questionIndex:i,option:j,submittedAt:serverTimestamp()});submitted=true;sessionStorage.setItem(key,'1');target.textContent='Respuesta registrada. Espere la siguiente pregunta.'}
catch(e){err(e);for(const btn of target.querySelectorAll('button'))btn.disabled=false}};
target.appendChild(b)}
}catch(e){notice('Error al mostrar alternativas: '+(e.message||e))}}
$('csv').onclick=()=>{const lines=[['Nombre','UID','Respondidas','Correctas'],...participants.map(p=>[p.name,p.uid,responses.filter(r=>r.uid===p.uid).length,responses.filter(r=>r.uid===p.uid&&questions[r.questionIndex]?.[2]===r.option).length])];const csv='\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='resultados_'+code+'.csv';a.click()};
</script></html>
